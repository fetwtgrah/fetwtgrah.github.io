baseURL = "https://fetwtgrah.github.io/"
locale = "zh-cn"
title = "Fresh的博客"

theme = "PaperMod"

# Enable custom CSS from assets/css/extended/
# PaperMod auto-loads all .css files from this directory

[markup.goldmark.renderer]
  unsafe = true

[menu]

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "Posts"
url = "/posts/"
weight = 2

[[menu.main]]
name = "Projects"
url = "/projects/"
weight = 3

[[menu.main]]
name = "About"
url = "/about/"
weight = 4

[params]
  defaultTheme = "auto"
  disableThemeToggle = false

  # Post display
  ShowReadingTime = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  mainSections = ["posts"]
  ShowWordCount = true
  ShowToc = true

  # Social
  socialIcons = [
    { name = "github", url = "https://github.com/fetwtgrah" },
  ]

  # Label / Logo — terminal style
  [params.label]
    text = "~/Fresh"

  # Footer
  [params.footer]
    hideCopyright = false
    text = "built with Hugo · deployed on GitHub Pages"

[params.homeInfoParams]
  Title = "Hi, I'm Fresh"
  Subtitle = "Software Engineering Student"
  Content = """
  Building things with **Go**, **Gin**, **PostgreSQL**, and **Docker**.
  Currently exploring backend systems, DevOps, and AI integration.
  """

