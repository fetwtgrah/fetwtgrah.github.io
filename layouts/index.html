{{ define "main" }}
<div class="home-page home-dashboard">
  <section class="dashboard-hero">
    <div class="dashboard-copy">
      <p class="eyebrow">Software engineering · 2026</p>
      <div class="title-avatar-row">
        <h1 class="home-title">新鲜-冰箱-<span>空调</span></h1>
        <div class="hero-avatar home-avatar">
          <img src="{{ "avatar.png" | relURL }}" alt="Fresh 的社媒头像">
        </div>
      </div>
      <p class="hero-subtitle">没有花生瓜子啤酒饮料矿泉水，不用让脚</p>
      <div class="hero-links">
        <a href="{{ "posts/" | relURL }}">文章 <span>↗</span></a>
        <a href="{{ "about/" | relURL }}">关于 <span>↗</span></a>
      </div>
    </div>
  </section>

  <section class="home-card-grid" aria-label="个人信息">
    <article class="home-note-card focus-card" data-home-card tabindex="0">
      <p class="note-label">正在学习</p>
      <div class="focus-card-content">
        <br>
        <p class="note-detail">Gin · PostgreSQL · Docker · Linux</p>
      </div>
      <span class="card-corner" aria-hidden="true">↗</span>
    </article>
    <div class="home-card-row">
      <article class="home-note-card motto-card" data-home-card tabindex="0">
        <p class="note-label">座右铭</p>
        <blockquote>“我与我周旋久，宁做我.”</blockquote>
      </article>
      <a class="home-note-card now-card" data-home-card href="{{ "anime-games/" | relURL }}" aria-label="打开 Hobbyverse">
        <p class="note-label">Hobby + Universe</p>
        <h2>Hobbyverse</h2>
        <p class="note-detail">这股力量吗？！</p>
        <span class="note-mark" aria-hidden="true">✦</span>
      </a>
    </div>
  </section>
</div>
{{ end }}
