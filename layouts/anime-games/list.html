{{ define "main" }}
<div class="mind-page">
  <header class="mind-header">
    <h1>REPO</h1>
    <p>把喜欢的故事和游戏，留在属于它们的时间坐标上。</p>
  </header>

  <section class="mind-map" data-mind-map aria-label="Hobbyverse 兴趣地图">
    <div class="mind-world" data-mind-world>
      <svg class="mind-lines" data-mind-lines aria-hidden="true"></svg>

      <div class="mind-hub">
        <small>HOBBY + UNIVERSE</small>
        <strong>Hobbyverse</strong>
        <span class="mind-hub-action">A map of what I love</span>
      </div>

      <div class="mind-node-field" data-mind-nodes></div>
    </div>

    <p class="mind-empty-hint" data-mind-empty>这里还没有收藏记录。</p>
    <div class="mind-canvas-controls" aria-label="画布控制">
      <button type="button" data-zoom-out aria-label="缩小画布" title="缩小">−</button>
      <button type="button" data-reset-view aria-label="回到中心" title="回到中心">◎</button>
      <button type="button" data-zoom-in aria-label="放大画布" title="放大">＋</button>
    </div>
  </section>
</div>

<dialog class="memory-viewer" data-memory-viewer>
  <article data-memory-detail></article>
  <div class="memory-viewer-actions">
    <button type="button" data-close-viewer>返回星图</button>
  </div>
</dialog>

<script type="application/json" data-hobbyverse-data>{{ hugo.Data.hobbyverse.items | default (slice) | jsonify | safeHTML }}</script>
<script type="module" src="{{ "js/anime-games.js" | relURL }}"></script>
{{ end }}
